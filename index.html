<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Intake Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>💧 Water Intake Tracker</h1>
            <p>Track your daily water consumption</p>
        </header>

        <section class="card">
            <h2>Today's Progress</h2>

            <div class="progress-circle" id="progressCircle">
                <div class="circle-content">
                    <h2 id="percentage">0%</h2>
                    <p>Completed</p>
                </div>
            </div>

            <h3 id="total">0 ml</h3>
            <p>Water consumed today</p>

            <div class="stats">
                <div>
                    <h3 id="goal">2000 ml</h3>
                    <p>Daily Goal</p>
                </div>
                <div>
                    <h3 id="remaining">2000 ml</h3>
                    <p>Remaining</p>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>Add Water</h2>
            <p>Select the amount you drank.</p>

            <div class="buttons">
                <button onclick="addWater(150)">150 ml</button>
                <button onclick="addWater(250)">250 ml</button>
                <button onclick="addWater(500)">500 ml</button>
            </div>

            <label for="customAmount">Custom amount (ml)</label>
            <input type="number" id="customAmount"
                   placeholder="Enter amount">

            <button class="add-button" onclick="addCustomWater()">
                Add Water
            </button>

            <button class="undo-button" onclick="undoWater()">
                Undo Last Entry
            </button>
        </section>

        <section class="card">
            <h2>Daily Goal</h2>
            <label for="goalInput">Set your goal (ml)</label>
            <input type="number" id="goalInput" value="2000">
            <button class="add-button" onclick="updateGoal()">
                Update Goal
            </button>
        </section>

        <section class="card">
            <h2>Today's Water History</h2>
            <ul id="history">
                <li>No water entries yet.</li>
            </ul>
        </section>

        <footer>
            <p>Stay hydrated, stay healthy! 💙</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
